name: CI

# PNPM setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    # Renovate only merges a renovate/* branch into main once a check passed on it. See CONTRIBUTING.md.
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

env:
  CI: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for the Turborepo Git filters.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.0.0"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-ci-v11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-v11-
            ${{ runner.os }}-turbo-v11-
          path: .turbo

      - name: Build packages
        # For a PR, only build the packages that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./packages/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-pkg
          fi

      - name: Build webpack sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/webpack/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-webpack
          fi

      - name: Build Rsbuild sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/rsbuild/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-rsbuild
          fi

      - name: Build Storybook Rsbuild sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/storybook/rsbuild}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-storybook-rsbuild
          fi

      - name: Build Storybook Rslib sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/storybook/rslib}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-storybook-rslib
          fi

      - name: oxlint
        # A single root task over the whole tree: oxlint takes seconds, and type-aware rules see across packages.
        # Type-aware rules resolve the packages through their dist folder, and a missing one silently weakens them
        # instead of failing: build every package first (the unchanged ones come from the Turborepo cache).
        run: |
          pnpm build-pkg
          pnpm turbo run //#oxlint

      - name: oxfmt
        run: pnpm turbo run //#oxfmt:check

      - name: Stylelint
        # For a PR, only stylelint the projects that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run stylelint --continue --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run stylelint --continue
          fi

      - name: Typecheck
        # For a PR, only typecheck the projects that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run typecheck --continue --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run typecheck --continue
          fi

      - name: Syncpack
        run: pnpm turbo run syncpack

      - name: Validate package skills
        run: pnpm validate-package-skills

      - name: Test agent tooling
        run: node --test .claude/skills/_update-skills/scripts/listSkillPins.test.ts

      - name: Test packages
        # For a PR, only test the projects that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm test --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm test
          fi

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

  agent-skill-changeset:
    # The skills in packages/*/skills ship in the npm packages: a skill change is only released with a changeset.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Check that a package skill change has a changeset
        run: |
          # Lists the skill folders of both the base branch and the pull request, so a deleted folder is still checked.
          mappings=()
          while IFS= read -r skills_dir; do
              mappings+=("$skills_dir=${skills_dir%/skills}")
          done < <({ git ls-tree -d -r --name-only HEAD^1 -- packages; git ls-tree -d -r --name-only HEAD -- packages; } | grep -E '^packages/[^/]+/skills$' | sort -u)

          if [ "${#mappings[@]}" -eq 0 ]; then
              echo "::error::No packages/*/skills directory found. Update this check if the package skills moved."
              exit 1
          fi

          bash .github/scripts/check-agent-skill-changeset.sh HEAD^1 "${mappings[@]}"
