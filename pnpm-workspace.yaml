packages:
  - packages/*
  - samples/**

# pnpm's own release-age gate, in minutes (24 hours). It matches pnpm's default, but it's set explicitly
# so the policy is visible and doesn't change silently.
minimumReleaseAge: 1440

# Workleap's own packages skip the gate.
minimumReleaseAgeExclude:
  - "@workleap/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  core-js-pure: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true

# Link approved package skills into .claude/skills only, even when another .<agent>/skills dir exists
# (pnpm's default links into every existing one).
skills:
  dirs:
    - .claude/skills
