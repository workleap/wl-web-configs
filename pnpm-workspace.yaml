packages:
  - packages/*
  - samples/**

# pnpm's own release-age gate, in minutes (24 hours). It matches pnpm's default, but it's set explicitly
# so the policy is visible and doesn't change silently. The GitHub package firewall (.npmrc) also holds
# back new releases.
minimumReleaseAge: 1440

# Workleap's own packages skip pnpm's gate (the firewall's still applies).
minimumReleaseAgeExclude:
  - "@workleap/*"

# Also loads .pnpmfile.cjs for pnpm dlx / pnpx, which ignore the project pnpmfile. The pnpmfile keeps
# the package downloads on the GitHub package firewall, see CONTRIBUTING.md.
globalPnpmfile: .pnpmfile.cjs

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  core-js-pure: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true

# The gsoft GitHub package firewall blocks these versions (AttestationDowngradePolicy: published without
# the SLSA provenance an earlier version had). Pin to a compatible version the firewall serves.
# Remove an entry once a newer version that the firewall serves is in range.
overrides:
  "ts-checker-rspack-plugin>chokidar": 4.0.1
