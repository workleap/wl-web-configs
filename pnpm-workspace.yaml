packages:
  - packages/*
  - samples/**

# pnpm's own release-age gate, in minutes (7 days). pnpm's default is 1440 (24 hours); the longer delay
# leaves more time for a compromised release to be detected and removed before it can be installed.
minimumReleaseAge: 10080

# Workleap's own packages skip the gate.
minimumReleaseAgeExclude:
  - "@workleap/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  core-js-pure: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true

# Link approved package skills into .claude/skills only, even when another .<agent>/skills dir exists
# (pnpm's default links into every existing one).
skills:
  dirs:
    - .claude/skills
