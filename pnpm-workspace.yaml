packages:
  - packages/*
  - samples/**

# Disables pnpm's default minimum release age of 24 hours. The GitHub package firewall already
# holds back new releases.
minimumReleaseAge: 0

# Also loads .pnpmfile.cjs for pnpm dlx / pnpx, which ignore the project pnpmfile. The pnpmfile keeps
# the package downloads on the GitHub package firewall, see CONTRIBUTING.md.
globalPnpmfile: .pnpmfile.cjs

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  core-js-pure: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true

# The gsoft GitHub package firewall blocks these versions (AttestationDowngradePolicy: published without
# the SLSA provenance an earlier version had). Pin to a compatible version the firewall serves.
# Remove an entry once a newer version that the firewall serves is in range.
overrides:
  "ts-checker-rspack-plugin>chokidar": 4.0.1
